<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="Onyx security modules: antinuke, automod, antiraid and whitelist with hardened defaults" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Menlo,Consolas,monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07080b"/>
      <stop offset="0.55" stop-color="#0b0c10"/>
      <stop offset="1" stop-color="#07080b"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11131a"/>
      <stop offset="1" stop-color="#0a0b0f"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f7a8c4"/>
      <stop offset="1" stop-color="#ff8fb1"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f7a8c4" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#f7a8c4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.022" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="300" fill="url(#bg)"/>
  <rect width="1280" height="300" fill="url(#grid)"/>
  <ellipse cx="1080" cy="120" rx="320" ry="180" fill="url(#glow)"/>

  <text x="48" y="44" fill="#ff8fb1" font-size="11.5" letter-spacing="3.4" opacity="0.9">// SECURITY MODULES</text>
  <text x="48" y="80" fill="#eceef2" font-size="27" font-weight="700">Security that stays quiet.</text>
  <text x="48" y="104" fill="#8f95a1" font-size="13">Hardened defaults for anti-nuke, raid response, and automated filtering.</text>

  <g>
    <rect x="48" y="128" width="278" height="118" rx="14" fill="url(#card)" stroke="#262833" stroke-width="1.2"/>
    <rect x="48" y="128" width="278" height="3" rx="1.5" fill="url(#pink)"/>
    <text x="68" y="158" fill="#f7a8c4" font-size="15.5" font-weight="700">!antinuke</text>
    <text x="308" y="154" fill="#6ee7a8" font-size="10" text-anchor="end" letter-spacing="1.4">ARMED</text>
    <text x="68" y="186" fill="#5f6470" font-size="14">&#8627;</text>
    <text x="88" y="186" fill="#8f95a1" font-size="12.5">role matrix &#183; action limits</text>
    <text x="68" y="218" fill="#454a54" font-size="11">stops destructive admin actions</text>
  </g>

  <g>
    <rect x="350" y="128" width="278" height="118" rx="14" fill="url(#card)" stroke="#262833" stroke-width="1.2"/>
    <rect x="350" y="128" width="278" height="3" rx="1.5" fill="url(#pink)"/>
    <text x="370" y="158" fill="#f7a8c4" font-size="15.5" font-weight="700">!automod</text>
    <text x="610" y="154" fill="#6ee7a8" font-size="10" text-anchor="end" letter-spacing="1.4">FILTERS</text>
    <text x="370" y="186" fill="#5f6470" font-size="14">&#8627;</text>
    <text x="390" y="186" fill="#8f95a1" font-size="12.5">spam &#183; invite &#183; link &#183; content</text>
    <text x="370" y="218" fill="#454a54" font-size="11">per-channel automated rules</text>
  </g>

  <g>
    <rect x="652" y="128" width="278" height="118" rx="14" fill="url(#card)" stroke="#262833" stroke-width="1.2"/>
    <rect x="652" y="128" width="278" height="3" rx="1.5" fill="url(#pink)"/>
    <text x="672" y="158" fill="#f7a8c4" font-size="15.5" font-weight="700">!antiraid</text>
    <text x="912" y="154" fill="#6ee7a8" font-size="10" text-anchor="end" letter-spacing="1.4">GUARD</text>
    <text x="672" y="186" fill="#5f6470" font-size="14">&#8627;</text>
    <text x="692" y="186" fill="#8f95a1" font-size="12.5">account-age gate &#183; lockdown</text>
    <text x="672" y="218" fill="#454a54" font-size="11">responds before the raid lands</text>
  </g>

  <g>
    <rect x="954" y="128" width="278" height="118" rx="14" fill="url(#card)" stroke="#262833" stroke-width="1.2"/>
    <rect x="954" y="128" width="278" height="3" rx="1.5" fill="url(#pink)"/>
    <text x="974" y="158" fill="#f7a8c4" font-size="15.5" font-weight="700">!whitelist</text>
    <text x="1214" y="154" fill="#6ee7a8" font-size="10" text-anchor="end" letter-spacing="1.4">TRUST</text>
    <text x="974" y="186" fill="#5f6470" font-size="14">&#8627;</text>
    <text x="994" y="186" fill="#8f95a1" font-size="12.5">trusted-user bypass</text>
    <text x="974" y="218" fill="#454a54" font-size="11">keeps staff unblocked</text>
  </g>

  <text x="640" y="280" fill="#5f6470" font-size="11.5" text-anchor="middle" letter-spacing="1.2">ANTINUKE &#183; ANTIRAID &#183; ANTIBETRAY &#183; AUTOMOD &#183; FORTRESS &#183; JAIL &#183; LIMITS</text>
</svg>
