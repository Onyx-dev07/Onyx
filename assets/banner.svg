<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="Onyx terminal console - antinuke, automod, antiraid and whitelist modules across 139 commands and 28 security modules" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Menlo,Consolas,monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07080b"/>
      <stop offset="0.55" stop-color="#0b0c10"/>
      <stop offset="1" stop-color="#07080b"/>
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101218"/>
      <stop offset="1" stop-color="#090a0e"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f7a8c4"/>
      <stop offset="1" stop-color="#ff8fb1"/>
    </linearGradient>
    <radialGradient id="glowPink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f7a8c4" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f7a8c4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowMint" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6ee7a8" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#6ee7a8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.022" stroke-width="1"/>
    </pattern>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <clipPath id="windowClip">
      <rect x="56" y="44" width="1164" height="332" rx="18"/>
    </clipPath>
  </defs>

  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#grid)"/>
  <ellipse cx="1030" cy="196" rx="340" ry="220" fill="url(#glowPink)" filter="url(#blur)"/>
  <ellipse cx="150" cy="52" rx="260" ry="150" fill="url(#glowMint)" filter="url(#blur)"/>

  <!-- window shadow -->
  <rect x="64" y="56" width="1152" height="322" rx="18" fill="#000000" opacity="0.5" filter="url(#blur)"/>

  <!-- terminal window -->
  <rect x="56" y="44" width="1164" height="332" rx="18" fill="url(#win)" stroke="#2a2c36" stroke-width="1.5"/>

  <!-- title bar -->
  <path d="M56 92H1220" stroke="#24262f" stroke-width="1"/>
  <circle cx="86" cy="68" r="6" fill="#ff6b81"/>
  <circle cx="108" cy="68" r="6" fill="#ffc66d"/>
  <circle cx="130" cy="68" r="6" fill="#6ee7a8"/>
  <text x="158" y="73" fill="#8b909c" font-size="13.5">onyx@discord: ~/security</text>
  <text x="360" y="73" fill="#4f535e" font-size="12.5">— zsh</text>

  <g>
    <circle cx="1014" cy="68" r="4" fill="#6ee7a8">
      <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="1028" y="73" fill="#6a6f7a" font-size="12.5">guarded</text>
    <text x="1196" y="73" fill="#4f535e" font-size="12.5" text-anchor="end">130x32</text>
  </g>

  <!-- scanline -->
  <g clip-path="url(#windowClip)">
    <rect x="56" y="92" width="1164" height="2" fill="#f7a8c4" opacity="0.14">
      <animate attributeName="y" values="92;372;92" dur="11s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- left column: security console -->
  <g font-size="15.5">
    <text x="88" y="124" fill="#ff8fb1">&#10095;</text>
    <text x="112" y="124">
      <tspan fill="#f7a8c4" font-weight="700">!antinuke</tspan>
      <tspan fill="#eceef2" dx="8">enable</tspan>
    </text>
    <text x="112" y="146" fill="#5f6470">&#8627;</text>
    <text x="134" y="146" fill="#8f95a1">role matrix &#183; destructive action limits</text>

    <text x="88" y="182" fill="#ff8fb1">&#10095;</text>
    <text x="112" y="182">
      <tspan fill="#f7a8c4" font-weight="700">!automod</tspan>
      <tspan fill="#eceef2" dx="8">enable</tspan>
    </text>
    <text x="112" y="204" fill="#5f6470">&#8627;</text>
    <text x="134" y="204" fill="#8f95a1">spam &#183; invite &#183; link &#183; content filters</text>

    <text x="88" y="240" fill="#ff8fb1">&#10095;</text>
    <text x="112" y="240">
      <tspan fill="#f7a8c4" font-weight="700">!antiraid</tspan>
      <tspan fill="#eceef2" dx="8">status</tspan>
    </text>
    <text x="112" y="262" fill="#5f6470">&#8627;</text>
    <text x="134" y="262" fill="#8f95a1">account-age gate &#183; auto lockdown</text>

    <text x="88" y="298" fill="#ff8fb1">&#10095;</text>
    <text x="112" y="298">
      <tspan fill="#f7a8c4" font-weight="700">!whitelist</tspan>
      <tspan fill="#eceef2" dx="8">add</tspan>
    </text>
    <text x="112" y="320" fill="#5f6470">&#8627;</text>
    <text x="134" y="320" fill="#8f95a1">trusted bypass &#183; staff stay unblocked</text>

    <text x="88" y="356" fill="#6ee7a8">[ok]</text>
    <text x="130" y="356" fill="#a9aeb8">139 commands &#183; 28 security modules</text>
  </g>

  <!-- divider -->
  <path d="M778 112V356" stroke="#22242d" stroke-width="1"/>

  <!-- right column: wordmark -->
  <g>
    <text x="816" y="130" fill="#ff8fb1" font-size="11.5" letter-spacing="3.4" opacity="0.85">// SECURITY CONSOLE</text>
    <text x="812" y="226" fill="url(#word)" font-size="94" font-weight="700" letter-spacing="13">ONYX</text>
    <rect x="818" y="242" width="104" height="5" fill="#ff8fb1"/>
    <text x="816" y="282" fill="#ff8fb1" font-size="11.5" letter-spacing="2.7">ANTINUKE &#183; ANTIRAID &#183; AUTOMOD</text>
    <text x="816" y="318" font-size="13">
      <tspan fill="#eceef2" font-weight="700">28</tspan>
      <tspan fill="#8f95a1"> security modules &#183; per guild</tspan>
    </text>
    <text x="816" y="342" font-size="13">
      <tspan fill="#eceef2" font-weight="700">110</tspan>
      <tspan fill="#8f95a1"> community commands</tspan>
    </text>
    <text x="1196" y="356" fill="#454a54" font-size="11" text-anchor="end" letter-spacing="1.5">v3.0.0</text>
  </g>
</svg>
