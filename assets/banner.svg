<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="Onyx terminal console — slap, kiss, ship and count commands with 129 total commands" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Menlo,Consolas,monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07080b"/>
      <stop offset="0.55" stop-color="#0b0c10"/>
      <stop offset="1" stop-color="#07080b"/>
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101218"/>
      <stop offset="1" stop-color="#0a0b0f"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f7a8c4"/>
      <stop offset="1" stop-color="#ff8fb1"/>
    </linearGradient>
    <radialGradient id="glowPink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f7a8c4" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#f7a8c4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowMint" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6ee7a8" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#6ee7a8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.022" stroke-width="1"/>
    </pattern>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <clipPath id="windowClip">
      <rect x="56" y="44" width="1164" height="332" rx="18"/>
    </clipPath>
  </defs>

  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#grid)"/>
  <ellipse cx="1030" cy="196" rx="330" ry="210" fill="url(#glowPink)" filter="url(#blur)"/>
  <ellipse cx="150" cy="52" rx="250" ry="140" fill="url(#glowMint)" filter="url(#blur)"/>

  <!-- window shadow -->
  <rect x="64" y="56" width="1152" height="322" rx="18" fill="#000000" opacity="0.5" filter="url(#blur)"/>

  <!-- terminal window -->
  <rect x="56" y="44" width="1164" height="332" rx="18" fill="url(#win)" stroke="#2a2c36" stroke-width="1.5"/>

  <!-- title bar -->
  <path d="M56 92H1220" stroke="#24262f" stroke-width="1"/>
  <circle cx="86" cy="68" r="6" fill="#ff6b81"/>
  <circle cx="108" cy="68" r="6" fill="#ffc66d"/>
  <circle cx="130" cy="68" r="6" fill="#6ee7a8"/>
  <text x="158" y="73" fill="#8b909c" font-size="13.5">onyx@discord: ~/console</text>
  <text x="360" y="73" fill="#4f535e" font-size="12.5">— zsh</text>

  <g>
    <circle cx="1014" cy="68" r="4" fill="#6ee7a8">
      <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="1028" y="73" fill="#6a6f7a" font-size="12.5">online</text>
    <text x="1196" y="73" fill="#4f535e" font-size="12.5" text-anchor="end">130x32</text>
  </g>

  <!-- scanline -->
  <g clip-path="url(#windowClip)">
    <rect x="56" y="92" width="1164" height="2" fill="#f7a8c4" opacity="0.14">
      <animate attributeName="y" values="92;372;92" dur="11s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- left column: live command demo -->
  <g font-size="15.5">
    <text x="88" y="127" fill="#ff8fb1">&#10095;</text>
    <text x="112" y="127" fill="#f7a8c4" font-weight="700">!slap</text>
    <text x="172" y="127" fill="#eceef2">@member</text>
    <text x="112" y="150" fill="#5f6470">&#8627;</text>
    <text x="134" y="150" fill="#8f95a1">anime GIF &#183; random target</text>

    <text x="88" y="185" fill="#ff8fb1">&#10095;</text>
    <text x="112" y="185" fill="#f7a8c4" font-weight="700">!kiss</text>
    <text x="172" y="185" fill="#eceef2">@member</text>
    <text x="112" y="208" fill="#5f6470">&#8627;</text>
    <text x="134" y="208" fill="#8f95a1">anime GIF &#183; random target</text>

    <text x="88" y="243" fill="#ff8fb1">&#10095;</text>
    <text x="112" y="243" fill="#f7a8c4" font-weight="700">!ship</text>
    <text x="172" y="243" fill="#eceef2">@you @them</text>
    <text x="112" y="266" fill="#5f6470">&#8627;</text>
    <text x="134" y="266" fill="#8f95a1">compatibility card &#183; stable per pair</text>

    <text x="88" y="307" fill="#6ee7a8">[ok]</text>
    <text x="130" y="307" fill="#a9aeb8">129 commands &#183; 28 security modules</text>

    <text x="88" y="332" fill="#6ee7a8">[ok]</text>
    <text x="130" y="332" fill="#a9aeb8">json storage ready &#183; postgres optional</text>

    <text x="88" y="360" fill="#ff8fb1">&#10095;</text>
    <rect x="112" y="347" width="9" height="16" fill="#f7a8c4">
      <animate attributeName="opacity" values="1;1;0;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- divider -->
  <path d="M778 112V356" stroke="#22242d" stroke-width="1"/>

  <!-- right column: wordmark -->
  <g>
    <text x="816" y="130" fill="#ff8fb1" font-size="11.5" letter-spacing="3.4" opacity="0.85">// SECURITY CONSOLE</text>
    <text x="812" y="228" fill="url(#word)" font-size="94" font-weight="700" letter-spacing="13">ONYX</text>
    <rect x="818" y="244" width="104" height="5" fill="#ff8fb1"/>
    <text x="816" y="284" fill="#ff8fb1" font-size="11.5" letter-spacing="2.7">SECURITY &#183; MODERATION &#183; CONTROL</text>
    <text x="816" y="320" font-size="13">
      <tspan fill="#eceef2" font-weight="700">101</tspan>
      <tspan fill="#8f95a1"> community commands</tspan>
    </text>
    <text x="816" y="344" font-size="13">
      <tspan fill="#eceef2" font-weight="700">28</tspan>
      <tspan fill="#8f95a1"> onyx security modules</tspan>
    </text>
    <text x="1196" y="356" fill="#454a54" font-size="11" text-anchor="end" letter-spacing="1.5">v3.0.0</text>
  </g>
</svg>
