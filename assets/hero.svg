<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-label="Onyx — security that never blinks. 138 commands, 28 security modules, 19 categories." font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08080d"/>
      <stop offset="0.5" stop-color="#0b0b12"/>
      <stop offset="1" stop-color="#07070b"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#f7a8c4"/>
      <stop offset="1" stop-color="#ff8fb1"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8fb1" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#ff8fb1"/>
      <stop offset="1" stop-color="#ff8fb1" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f7a8c4" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#f7a8c4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mint" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6ee7a8" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#6ee7a8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#ffffff" stroke-opacity="0.028" stroke-width="1"/>
    </pattern>
    <filter id="blur" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1280" height="460" fill="url(#bg)"/>
  <rect width="1280" height="460" fill="url(#grid)"/>
  <ellipse cx="1052" cy="150" rx="390" ry="260" fill="url(#glow)" filter="url(#blur)"/>
  <ellipse cx="132" cy="430" rx="300" ry="180" fill="url(#mint)" filter="url(#blur)"/>

  <!-- orbit detail behind the status card -->
  <g fill="none" stroke="#f7a8c4" stroke-opacity="0.12">
    <circle cx="1005" cy="230" r="216"/>
    <circle cx="1005" cy="230" r="182" stroke-opacity="0.08"/>
    <circle cx="1005" cy="230" r="248" stroke-opacity="0.05"/>
  </g>
  <g stroke="#f7a8c4" stroke-opacity="0.5">
    <path d="M1005 12v22"/>
    <path d="M1005 426v22"/>
    <path d="M787 230h-22"/>
    <path d="M1223 230h22"/>
  </g>

  <!-- left: editorial wordmark -->
  <g>
    <rect x="72" y="64" width="30" height="2" fill="#ff8fb1"/>
    <text x="114" y="70" fill="#8b909c" font-size="11.5" letter-spacing="4" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace">DISCORD INFRASTRUCTURE / V3</text>

    <text x="68" y="202" fill="url(#word)" font-size="136" font-weight="700" letter-spacing="16">ONYX</text>

    <text x="72" y="264" fill="#f5f5f7" font-size="31" font-weight="600" letter-spacing="-0.4">Security that never blinks.</text>
    <text x="72" y="296" fill="#8b909c" font-size="15.5">One bot for the firewall, the mod queue, and the community.</text>

    <rect x="72" y="332" width="420" height="1" fill="url(#rule)"/>

    <g font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace">
      <text x="72" y="376" fill="#f7a8c4" font-size="26" font-weight="700">138</text>
      <text x="72" y="396" fill="#6f7480" font-size="10.5" letter-spacing="2">COMMANDS</text>
      <path d="M158 358v42" stroke="#2a2a36"/>
      <text x="184" y="376" fill="#f7a8c4" font-size="26" font-weight="700">28</text>
      <text x="184" y="396" fill="#6f7480" font-size="10.5" letter-spacing="2">SECURITY MODULES</text>
      <path d="M350 358v42" stroke="#2a2a36"/>
      <text x="376" y="376" fill="#f7a8c4" font-size="26" font-weight="700">19</text>
      <text x="376" y="396" fill="#6f7480" font-size="10.5" letter-spacing="2">CATEGORIES</text>
    </g>
  </g>

  <!-- right: glass status panel -->
  <g>
    <rect x="836" y="76" width="372" height="308" rx="22" fill="#000000" opacity="0.45" filter="url(#soft)"/>
    <rect x="830" y="70" width="372" height="308" rx="22" fill="#0d0d14" fill-opacity="0.92" stroke="#2a2a36"/>

    <circle cx="862" cy="104" r="4.5" fill="#f7a8c4"/>
    <text x="878" y="109" fill="#c9ccd4" font-size="11" letter-spacing="3" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace">SYSTEM STATUS</text>
    <text x="1174" y="109" fill="#565b66" font-size="10.5" text-anchor="end" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace">LIVE</text>
    <path d="M830 130h372" stroke="#22242d"/>

    <g font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="11.5">
      <text x="862" y="166" fill="#8b909c" letter-spacing="2">ANTINUKE</text>
      <text x="1170" y="166" fill="#6ee7a8" text-anchor="end" letter-spacing="1">ARMED</text>
      <path d="M862 184h308" stroke="#1c1e26"/>

      <text x="862" y="212" fill="#8b909c" letter-spacing="2">ANTIRAID</text>
      <text x="1170" y="212" fill="#6ee7a8" text-anchor="end" letter-spacing="1">GATED</text>
      <path d="M862 230h308" stroke="#1c1e26"/>

      <text x="862" y="258" fill="#8b909c" letter-spacing="2">AUTOMOD</text>
      <text x="1170" y="258" fill="#6ee7a8" text-anchor="end" letter-spacing="1">ONLINE</text>
      <path d="M862 276h308" stroke="#1c1e26"/>

      <text x="862" y="304" fill="#8b909c" letter-spacing="2">LIMIT SYSTEM</text>
      <text x="1170" y="304" fill="#ffc66d" text-anchor="end" letter-spacing="1">WATCHING</text>
      <path d="M862 322h308" stroke="#1c1e26"/>

      <text x="862" y="350" fill="#565b66" letter-spacing="1.4">PER-GUILD REGISTRATION</text>
      <text x="1170" y="350" fill="#565b66" text-anchor="end">v3.0.0</text>
    </g>

    <text x="1005" y="426" fill="#4a4e58" font-size="10.5" text-anchor="middle" letter-spacing="2.6" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace">ONYX / SECURITY / COMMUNITY</text>
  </g>

  <!-- corner accents -->
  <g stroke="#f7a8c4" stroke-opacity="0.5">
    <path d="M72 428h26" stroke-width="1.5"/>
    <path d="M1208 428h-26" stroke-width="1.5"/>
  </g>
</svg>
